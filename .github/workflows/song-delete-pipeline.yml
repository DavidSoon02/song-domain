name: Pipeline for Song Delete Microservice

on:
  push:
    branches:
      - test
    paths:
      - 'delete-service/**'
      - '.github/workflows/song-delete-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'delete-service/**'
      - '.github/workflows/song-delete-pipeline.yml'

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_DELETE }}:latest ./delete-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_DELETE }}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_DELETE }}:latest
            docker stop ${{ secrets.DOCKER_IMAGE_DELETE }} || true
            docker rm ${{ secrets.DOCKER_IMAGE_DELETE }} || true
            docker run --restart always -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
                       -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
                       -e JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }} \
                       -d --name ${{ secrets.DOCKER_IMAGE_DELETE }} \
                       -p 3002:3002 ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_DELETE }}:latest
